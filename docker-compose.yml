services:
  gphotos-uploader:
    image: ghcr.io/giuseppe99barchetta/google-photos-uploader:latest
    container_name: gphotos-uploader
    restart: unless-stopped
    stop_grace_period: 150s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      WATCHED_FOLDER: /data
      STATE_DIR: /state
      HOME: /state
      AUTH_DATA: ${AUTH_DATA:-}
      AUTH_DATA_FILE: ${AUTH_DATA_FILE:-}
      DELETE_AFTER_UPLOAD: ${DELETE_AFTER_UPLOAD:-false}
      STABLE_SECONDS: ${STABLE_SECONDS:-5}
      STABILITY_TIMEOUT: ${STABILITY_TIMEOUT:-300}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      POLL_INTERVAL: ${POLL_INTERVAL:-1}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      RETRY_BASE: ${RETRY_BASE:-5}
      RETRY_MAX: ${RETRY_MAX:-3600}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${PHOTO_FOLDER:-./photos}
        target: /data
        bind:
          create_host_path: false
      - uploader-state:/state
    # If necessary, specify the UID/GID of the user for file permissions
    # user: "1000:1000"

volumes:
  uploader-state:
